[package]
name = "htmltoapk"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
description = "Turn any HTML website into an Android APK using Capacitor. CLI + TUI."
authors = ["htmltoapk contributors"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/yourname/htmltoapk"
homepage = "https://github.com/yourname/htmltoapk"
keywords = ["android", "apk", "capacitor", "cli", "tui"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["docs/screenshots/*", "examples/*"]

[[bin]]
name = "htmltoapk"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
dirs = "5.0"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
